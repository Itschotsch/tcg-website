<section class="section">
    <div class="background-flavour-image fadeout-bottom"
        style="background-image: url(/public/assets/hero-background.webp); background-position: center bottom;"></div>
    <div class="container has-text-centered hero-title safe-borders">
        <img class="hero-logo small" src="/public/assets/anor-logo.webp" alt="{{env.websiteName}}" />
    </div>
    <div class="container has-text-centered is-max-mobile safe-borders" style="margin-top: -2rem; padding-bottom: 6rem; max-width: 30rem; margin-left: auto; margin-right: auto;">
        <div style="display: flex; flex-direction: column; gap: 1.25rem; align-items: center; width: 100%;">
            {{
                env.shareButtons.map((button) => {
                return `
                    <a class="button is-illustrated" href="${button.url}" target="${button.target}" style="width: 100%; display: flex; align-items: center; justify-content: start; border-radius: 8px; font-weight: 500; height: 3.5rem;">
                        ${button.icon ? `
                        <span class="icon" style="margin-left: 0; margin-right: 0.5rem; display: flex; align-items: center;">
                            <img src="${button.icon}" alt="${button.text}" style="height: 1.5rem; width: 1.5rem;" />
                        </span>` : ''}
                        <span>${button.text}</span>
                    </a>
                `;
                }).join("");
            }}
        </div>
    </div>
</section>
<footer class="section">
    <div class="background-flavour-image extended-up fadeout-top"
        style="background-image: url(/public/assets/footer-background.webp); background-position: center bottom;">
    </div>
    <div class="content has-text-centered">
        <p>
            {{env.footerText}}
        </p>
    </div>
</footer>
