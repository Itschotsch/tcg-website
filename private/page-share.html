<div class="page-share">
    <section class="section">
        <div class="background-flavour-image fadeout-bottom"
            style="background-image: url(/public/assets/elemental-map-background.webp); background-position: center top;"></div>
        <div class="container has-text-centered safe-borders">
            <a href="/">
                <img class="share-logo" src="/public/assets/anor-logo.webp" alt="Anor" />
            </a>
            <div class="share-links">
                {{
                    env.shareLinks.map((item) => {
                        return `
                            <a class="share-link" href="${item.link}">
                                <span class="share-link-title">${item.title}</span>
                                <span class="share-link-image" style="background-image: url(${item.image});"></span>
                            </a>
                        `;
                    }).join("");
                }}
            </div>
        </div>
    </section>
</div>
